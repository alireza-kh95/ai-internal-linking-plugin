name: Validate and release plugin
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and JavaScript
        run: |
          find ai-internal-linking -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check ai-internal-linking/assets/js/admin.js
          php tests/regression.php
      - name: Build installable archive
        run: |
          mkdir -p dist
          zip -r dist/ai-internal-linking.zip ai-internal-linking -x '*.DS_Store' '*/.git/*'
          unzip -t dist/ai-internal-linking.zip
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^ \* Version: *\([0-9.]*\).*/\1/p' ai-internal-linking/ai-internal-linking.php)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the plugin version to publish an update."
            exit 0
          fi
          gh release create "$TAG" dist/ai-internal-linking.zip --target "$GITHUB_SHA" --title "AI Internal Linking $VERSION" --notes-file RELEASE_NOTES.md --latest

